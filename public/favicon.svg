<!--
  Simplified favicon build of the Fam1 mark: same path outlines as
  Fam1Logo.jsx's flat variant, but as a standalone static file (favicons
  can't be React components). Unlike every other placement of this logo,
  which sits transparently on the app's own dark background, this one keeps
  a dark canvas rect on purpose — a favicon has no surrounding app UI to
  inherit contrast from, and needs to stay legible against whatever the
  browser's own tab-bar color happens to be (often light).
-->
